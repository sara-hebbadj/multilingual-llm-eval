[project]
name = "multieval"
version = "0.1.0"
description = "Arabic / English / French LLM evaluation and red-team suite for a customer-service assistant"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sara Hebbadj" }]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "scikit-learn>=1.4"]  # scikit-learn: only to cross-check kappa
app = ["gradio>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
